name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 格式化 / 静态检查 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 代码格式化检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

  build:
    name: 构建 release APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 APK（单架构 arm64）
        run: flutter build apk --release --target-platform android-arm64

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: sakura-read-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
